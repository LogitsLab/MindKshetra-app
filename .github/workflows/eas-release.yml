name: EAS store release

on:
  push:
    branches: [main]
    paths:
      - app.json
      - package.json
      - eas.json
      - store/**
      - app/**
      - src/**
      - assets/**
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and submit
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      android_track:
        description: Play track (internal = testers, production-play = draft production)
        type: choice
        options:
          - internal
          - production-play
        default: internal
      skip_submit:
        description: Build only (skip store submit)
        type: boolean
        default: false

concurrency:
  group: eas-store-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.notes.outputs.version }}
      whats_new: ${{ steps.notes.outputs.whats_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide whether to release
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Auto-release when marketing version changed, or version-bump commit
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OLD=$(git show "$BEFORE:app.json" 2>/dev/null | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).expo.version" || echo "")
          NEW=$(node -pe "require('./app.json').expo.version")
          MSG=$(git log -1 --pretty=%s)
          if [ -n "$OLD" ] && [ "$OLD" != "$NEW" ]; then
            echo "Version changed $OLD → $NEW"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qi 'chore: bump version'; then
            echo "Version bump commit detected"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version change — skip store release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release notes
        if: steps.check.outputs.should_release == 'true'
        id: notes
        run: node scripts/release-notes.mjs --write-env

  build-submit:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # EXPO_TOKEN must belong to the Expo owner of this project (imsaksham.c).
      # A token from another account used to fail every store release with
      # "Entity not authorized: AppEntity[93fe4bed-...]". Skip instead of
      # painting the commit red.
      - name: Verify Expo token can access this project
        id: expo
        run: |
          set +e
          who=$(eas whoami 2>&1)
          who_code=$?
          set -e
          echo "$who"
          if [ -z "${EXPO_TOKEN:-}" ] || [ "$who_code" -ne 0 ]; then
            echo "::warning::EXPO_TOKEN missing or eas whoami failed. Create a token while logged in as imsaksham.c. Skipping store release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          info=$(eas project:info --non-interactive 2>&1)
          info_code=$?
          set -e
          echo "$info"
          if [ "$info_code" -ne 0 ]; then
            if echo "$info" | grep -qiE 'not authorized|Entity not authorized|incorrect user'; then
              echo "::warning::EXPO_TOKEN cannot read this Expo project (owner imsaksham.c). Update the GitHub secret. Skipping store release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::eas project:info failed"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Write Google Play service account
        if: steps.expo.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON secret (Play submit)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
          node -e "JSON.parse(require('fs').readFileSync('google-service-account.json','utf8'))"

      - name: Ensure release notes file for this version
        run: node scripts/release-notes.mjs --ensure-file

      - name: Resolve notes
        id: notes
        run: node scripts/release-notes.mjs --write-env

      - name: Select platforms
        id: plat
        run: |
          P="${{ github.event.inputs.platforms || 'all' }}"
          echo "platform=$P" >> "$GITHUB_OUTPUT"
          TRACK="${{ github.event.inputs.android_track || 'internal' }}"
          if [ "$TRACK" = "production-play" ]; then
            echo "submit_profile=production-play" >> "$GITHUB_OUTPUT"
          else
            echo "submit_profile=production" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS build + submit
        if: ${{ steps.expo.outputs.skip != 'true' && github.event.inputs.skip_submit != 'true' }}
        env:
          NOTES: ${{ steps.notes.outputs.whats_new }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -euo pipefail
          PLATFORM="${{ steps.plat.outputs.platform }}"
          PROFILE="${{ steps.plat.outputs.submit_profile }}"
          VERSION="${{ steps.notes.outputs.version }}"
          echo "Building platform=$PLATFORM submit_profile=$PROFILE version=$VERSION"
          echo "What's new (for GitHub summary / store listing):"
          echo "$NOTES"
          # --auto-submit uploads the IPA to TestFlight / Play. It must NOT
          # send the iOS version to App Review. Review is clicked in App Store
          # Connect by Saksham Chaurasia so Submitted By is not "API user".
          # Use the `store` profile (remote credentials) — CI has no local
          # keystore / credentials.json. iOS and Android are split because a
          # single --platform all job cannot use two credential sources.
          build_one() {
            local plat="$1"
            eas build \
              --platform "$plat" \
              --profile store \
              --non-interactive \
              --no-wait \
              --auto-submit-with-profile="$PROFILE" \
              --message "v${VERSION} — store release"
          }
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "ios" ]; then
            build_one ios
          fi
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "android" ]; then
            build_one android
          fi

      - name: EAS build only
        if: ${{ steps.expo.outputs.skip != 'true' && github.event.inputs.skip_submit == 'true' }}
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -euo pipefail
          PLATFORM="${{ steps.plat.outputs.platform }}"
          build_one() {
            local plat="$1"
            eas build \
              --platform "$plat" \
              --profile store \
              --non-interactive \
              --no-wait \
              --message "v${{ steps.notes.outputs.version }} — build only"
          }
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "ios" ]; then
            build_one ios
          fi
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "android" ]; then
            build_one android
          fi

      - name: Summary
        run: |
          {
            echo "## EAS store release"
            echo ""
            echo "- **Version:** \`${{ steps.notes.outputs.version }}\`"
            echo "- **Platforms:** \`${{ steps.plat.outputs.platform }}\`"
            echo "- **Submit profile:** \`${{ steps.plat.outputs.submit_profile }}\`"
            echo "- **Expo access skip:** \`${{ steps.expo.outputs.skip }}\`"
            echo "- **Dashboard:** https://expo.dev/accounts/imsaksham.c/projects/mindkshetra"
            echo ""
            echo "iOS App Review: after the build is processed, Saksham Chaurasia submits from App Store Connect in the browser. Do not submit for review via the ASC API key."
            echo ""
            echo "### What's new"
            echo ""
            echo "${{ steps.notes.outputs.whats_new }}"
          } >> "$GITHUB_STEP_SUMMARY"
