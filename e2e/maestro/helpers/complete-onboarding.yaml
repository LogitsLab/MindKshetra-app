appId: app.mindkshetra.mobile
---
- tapOn:
    id: onboarding-continue
- tapOn:
    id: onboarding-goals-next
- tapOn:
    id: onboarding-inspirations-next
- tapOn:
    id: onboarding-time-next
- tapOn:
    id: onboarding-setup-next
- tapOn:
    id: onboarding-guest
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: onboarding-guest
    commands:
      - tapOn:
          id: onboarding-guest
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
