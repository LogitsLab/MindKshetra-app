appId: app.mindkshetra.mobile
name: Four tabs and Madhav
tags:
  - core
---
- launchApp
- runFlow:
    file: ../helpers/wait-for-app.yaml
- runFlow:
    when:
      visible:
        id: onboarding-continue
    file: ../helpers/complete-onboarding.yaml
- tapOn:
    id: tab-practise
- assertVisible:
    id: screen-practise
- tapOn:
    id: tab-path
- assertVisible:
    id: screen-path
- tapOn:
    id: tab-profile
- assertVisible:
    id: screen-profile
- tapOn:
    id: tab-home
- assertVisible:
    id: screen-home
- tapOn:
    id: madhav-fab
- assertVisible:
    id: screen-madhav
- tapOn:
    id: madhav-close
- assertVisible:
    id: screen-home
