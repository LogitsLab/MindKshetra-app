appId: app.mindkshetra.mobile
name: Mood opens detail
tags:
  - core
---
- launchApp
- runFlow:
    file: ../helpers/wait-for-app.yaml
- runFlow:
    when:
      visible:
        id: onboarding-continue
    file: ../helpers/complete-onboarding.yaml
- tapOn:
    id: tab-path
- tapOn:
    id: home-path-mood
- assertVisible:
    id: screen-mood
- tapOn:
    id: mood-anxious
- assertVisible:
    id: screen-mood-detail
