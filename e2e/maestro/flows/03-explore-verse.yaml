appId: app.mindkshetra.mobile
name: Explore chapter to verse
tags:
  - core
---
- launchApp
- runFlow:
    when:
      visible:
        id: onboarding-continue
    file: ../helpers/complete-onboarding.yaml
- tapOn:
    id: tab-explore
- tapOn:
    id: explore-chapter-1
- assertVisible:
    id: screen-chapter
- extendedWaitUntil:
    visible:
      id: verse-card
    timeout: 20000
- tapOn:
    id: verse-card
- assertVisible:
    id: screen-sloka
- tapOn:
    id: sloka-narration
- assertVisible:
    id: sloka-narration
- tapOn:
    id: sloka-ask-madhav
- assertVisible:
    id: screen-madhav
- tapOn:
    id: madhav-close
