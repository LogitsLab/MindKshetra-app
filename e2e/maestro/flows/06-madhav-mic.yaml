appId: app.mindkshetra.mobile
name: Ask Madhav has no microphone
tags:
  - crash
  - review
---
- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/wait-for-app.yaml
- runFlow:
    file: ../helpers/complete-onboarding.yaml
- tapOn:
    id: madhav-fab
- extendedWaitUntil:
    visible:
      id: screen-madhav
    timeout: 10000
- assertVisible:
    id: screen-madhav
- assertNotVisible:
    id: madhav-voice
