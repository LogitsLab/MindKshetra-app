appId: app.mindkshetra.mobile
name: Ask Madhav microphone does not crash
tags:
  - crash
  - review
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: onboarding-continue
    timeout: 20000
- runFlow:
    file: ../helpers/complete-onboarding.yaml
- tapOn:
    id: madhav-fab
- extendedWaitUntil:
    visible:
      id: screen-madhav
    timeout: 10000
- tapOn:
    id: madhav-voice
# Permission sheets (mic, then speech). Accept if present; continue if already granted.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: Allow
    commands:
      - tapOn: Allow
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: Allow
    commands:
      - tapOn: Allow
- waitForAnimationToEnd
# Crash would kill the process; Madhav still on screen is the pass.
- assertVisible:
    id: screen-madhav
- assertVisible:
    id: madhav-voice
