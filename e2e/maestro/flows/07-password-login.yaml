appId: app.mindkshetra.mobile
name: Email + password sign-in unlocks the account
tags:
  - auth
  - review
# Requires a seeded account on the target backend. Override at run time:
#   maestro test -e EMAIL=review@mindkshetra.app -e PASSWORD=... e2e/maestro/flows/07-password-login.yaml
# iOS inputText garbles `@` and special characters; paste via Maestro clipboard.
# PASSWORD must be passed with -e; do not default it here.
env:
  EMAIL: review@mindkshetra.app
---
- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/wait-for-app.yaml
# Reviewer path: onboarding → Use email instead → password sign-in.
- runFlow:
    file: ../helpers/advance-to-auth.yaml
- extendedWaitUntil:
    visible:
      id: auth-email-open
    timeout: 10000
- tapOn:
    id: auth-email-open
- tapOn:
    id: auth-email-input
- eraseText
# Split around `@` — iOS XCTest otherwise drops or relocates it.
- inputText:
    id: auth-email-input
    text: "review"
- inputText: "@mindkshetra.app"
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: auth-password-input
    direction: DOWN
    timeout: 10000
- tapOn:
    id: auth-password-input
- eraseText
- inputText: ${PASSWORD}
- hideKeyboard:
    optional: true
- tapOn:
    id: auth-password-submit
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- assertVisible:
    id: screen-home
- tapOn:
    id: tab-profile
- assertNotVisible:
    id: screen-auth
