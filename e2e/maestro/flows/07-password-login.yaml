appId: app.mindkshetra.mobile
name: Email + password sign-in unlocks the account
tags:
  - auth
  - review
# Requires a seeded account on the target backend. Override at run time:
#   maestro test -e EMAIL=review@mindkshetra.app -e PASSWORD=... e2e/maestro/flows/07-password-login.yaml
env:
  EMAIL: review@mindkshetra.app
  PASSWORD: changeme
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: onboarding-continue
    timeout: 20000
# Enter as a guest first so the Profile tab shows the upgrade / sign-in panel.
- runFlow:
    file: ../helpers/complete-onboarding.yaml
- tapOn:
    id: tab-profile
- extendedWaitUntil:
    visible:
      id: screen-auth
    timeout: 10000
# Open the email panel, then sign in with email + password.
- tapOn:
    id: auth-email-open
- tapOn:
    id: auth-email-input
- inputText: ${EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-password-submit
- waitForAnimationToEnd
# Success = the sign-in panel is gone (session upgraded to a real account).
# A wrong/absent seeded account leaves the panel visible and fails here.
- extendedWaitUntil:
    notVisible:
      id: auth-password-submit
    timeout: 15000
- assertNotVisible:
    id: screen-auth
